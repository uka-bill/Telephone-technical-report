{% extends "base.html" %}

{% block content %}
<style>
    /* ... (same CSS as before, with .btn-refresh added) ... */
    .btn-refresh {
        background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
        border: none;
        border-radius: 10px;
        padding: 6px 14px;
        font-weight: 600;
        color: white;
        transition: all 0.2s;
        font-size: 12px;
    }
    .btn-refresh:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        color: white;
    }
    /* ... rest of CSS unchanged ... */
</style>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-droplet text-info"></i> Water Reports</h2>
    <div class="d-flex align-items-center gap-2">
        <div class="stats-badge">
            <i class="bi bi-envelope"></i> Pending: <span id="pendingCount">0</span>
        </div>
        <button class="btn-refresh" onclick="loadReports()">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>
</div>

<!-- ... rest of the page unchanged (stat cards, filters, table, modals, scripts) ... -->

<script>
    // ... all existing JavaScript ...
    // The loadReports() function is called on DOMContentLoaded.
    // NO setInterval used.
</script>
{% endblock %}
